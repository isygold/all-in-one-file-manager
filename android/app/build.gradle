plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.fmx.manager'
    compileSdk 34
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.fmx.manager'
        minSdk 24
        targetSdk 33
        versionCode 2
        versionName '1.1.0'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {}
        release {
            // sideload build; no minify to keep WebView/Chaquopy simple
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        // filemanager.py is stdlib-only; pip{} stays empty on purpose
        version '3.10'
    }
}

dependencies {
}
